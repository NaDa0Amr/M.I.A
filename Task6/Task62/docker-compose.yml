version: '3.8'

services:
  # Streamlit App
  caption-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image_captioning_streamlit
    ports:
      - "8501:8501"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped

  # Gradio App
  caption-gradio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: image_captioning_gradio
    ports:
      - "7860:7860"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - GRADIO_SERVER_NAME=0.0.0.0
    volumes:
      - ./checkpoints:/app/checkpoints
    entrypoint: ["python", "app/gradio_app.py"]
    restart: unless-stopped
